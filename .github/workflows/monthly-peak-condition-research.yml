name: Research monthly peak indicator conditions
on:
  workflow_dispatch:
    inputs:
      dataset_run_id:
        description: Evening snapshot run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stockai-monthly-peak-condition-research-${{ inputs.dataset_run_id }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore exact evening snapshot
        uses: actions/cache/restore@v5
        with:
          path: data/stockai.db
          key: stockai-evening-analysis-${{ inputs.dataset_run_id }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Export market data only
        run: python scripts/export_market_research.py --source data/stockai.db --output reports/market-research.db
      - name: Analyze monthly peak indicator conditions
        run: python scripts/run_monthly_peak_condition_research.py --database reports/market-research.db --output reports/monthly-peak-condition-research.json
      - uses: actions/upload-artifact@v6
        with:
          name: monthly-peak-condition-research-${{ inputs.dataset_run_id }}
          path: reports/monthly-peak-condition-research.json
          if-no-files-found: error
          retention-days: 14
