name: StockAI requested stock analysis
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Saved analysis request ID
        required: true
        type: string
      dataset_run_id:
        description: Evening snapshot run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stockai-request-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANALYSIS_REQUEST_ID: ${{ inputs.request_id }}
      EVENING_DATASET_RUN_ID: ${{ inputs.dataset_run_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore requested evening snapshot
        uses: actions/cache/restore@v5
        with:
          path: data/stockai.db
          key: stockai-evening-analysis-${{ inputs.dataset_run_id }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyze the requested stock
        run: python scripts/run_backtest_requests.py
      - name: Record workflow failure
        if: failure() || cancelled()
        run: python scripts/fail_analysis_request.py
