name: StockAI daily notification

on:
  workflow_dispatch:
  schedule:
    # 10:07 JST, Monday-Friday (GitHub Actions cron uses UTC).
    - cron: "7 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stockai-database
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      GITHUB_CHARTS_TOKEN: ${{ github.token }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STOCKAI_JOB_LABEL: 朝の候補更新・アプリ反映

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore latest database
        uses: actions/cache/restore@v5
        with:
          path: data/stockai.db
          key: stockai-db-${{ github.run_id }}
          restore-keys: |
            stockai-db-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize stock universe
        run: python scripts/bootstrap_cloud.py

      - name: Publish stock search catalog
        run: python scripts/publish_stock_catalog.py

      - name: Update, analyze, and publish app results
        run: python scripts/run_daily_pipeline.py --candidate-pool --skip-backtest --backtest-matches

      - name: Generate app results for all saved user settings
        run: python scripts/run_cloud_user_screenings.py

      - name: Process requested stock backtests
        run: python scripts/run_backtest_requests.py

      - name: Save updated database
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/stockai.db
          key: stockai-db-${{ github.run_id }}

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stockai-reports-${{ github.run_id }}
          path: |
            reports/*.json
            reports/logs/*.log
          if-no-files-found: ignore
          retention-days: 30
