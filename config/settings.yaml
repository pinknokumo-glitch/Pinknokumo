database:
  path: data/stockai.db

providers:
  yfinance:
    enabled: true
    suffix: ".T"
    interval: "1d"
    period: "10y"
    auto_adjust: false
    repair: true
    retries: 3
    retry_delay_seconds: 2
    daily_update_overlap_days: 7
    bulk_chunk_size: 100
    bulk_initial_period: "2y"
    bulk_incremental_period: "10d"
  jquants:
    enabled: true
    api_key_env: JQUANTS_API_KEY
    daily_financial_update: true
    financial_cache_hours: 72
    request_interval_seconds: 1
    retries: 4
    retry_delay_seconds: 3

resampling:
  weekly_rule: W-FRI
  monthly_rule: ME

market_indices:
  - code: NIKKEI225
    ticker: ^N225

application:
  timezone: Asia/Tokyo
  log_level: INFO
  default_result_limit: 100

cloud_screening:
  # Free-tier guardrails. Identical user settings are still calculated only once.
  max_groups: 50
  max_hits_per_group: 100
  # Continue configured auto-relaxation when the first stage yields only a few stocks.
  minimum_hits_before_relaxation: 5
  # Backfill only matched stocks when long horizons need more history.
  backtest_history_period: "10y"
  backtest_history_chunk_size: 5
  backtest_minimum_signal_sessions: 252
  # Run the same rule across the acquired universe and reuse each saved result.
  # This guard is intentionally above the current listed-stock universe.
  pooled_backtest_max_codes: 5000

screening_universe:
  markets: [プライム, スタンダード, グロース]
  prefilter:
    weekly_rsi_max: 50
    monthly_rsi_max: 25
  maximum_pool_age_days: 4
  minimum_coverage_ratio: 0.95

# A fixed, global short-horizon research set.  These patterns are intentionally
# independent of each user's saved screening rules and of delivery results.
short_horizon_patterns:
  horizons: [3, 5, 10]
  display_horizon: 5
  target_percent: 3.0
  # "Confirmed" means a later daily close crosses the signal candle high/low,
  # followed by entry at the next session open. It is intentionally not sold as
  # a real-time intraday execution model.
  confirmed_minimum_trade_count: 15
  confirmed_minimum_oos_trade_count: 3
  confirmed_window_sessions: 3
  primary:
    minimum_trade_count: 30
    minimum_oos_trade_count: 6
    minimum_probability_percent: 55.0
    maximum_candidates_per_side: 20
  watch:
    minimum_trade_count: 20
    minimum_oos_trade_count: 4
    minimum_probability_percent: 50.0
    maximum_candidates_per_side: 30
